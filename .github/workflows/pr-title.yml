name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PR title follows the knowledge commit convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/kb.py commit-msg --title "$TITLE"
